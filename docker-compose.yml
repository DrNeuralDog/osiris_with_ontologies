name: osiris
services:
  osiris:
    # Builds locally from the Dockerfile so you always run the cloned code.
    # To use the prebuilt image instead, replace the `build:` block below with
    # `image: ghcr.io/simplifaisoul/osiris:latest`.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osiris
    # Host port is configurable via OSIRIS_PORT in .env (defaults to 3000).
    ports:
      - "${OSIRIS_PORT:-3000}:3000"
    # Optional API keys / scanner backend — copy .env.example to .env.
    # .env remains supported by Compose interpolation; no file is required.
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - INTEL_URL=http://osiris-intel:4000
      - INTELLIGENCE_REPORTING=1
      - INTELLIGENCE_REPORT_KEY=${INTELLIGENCE_REPORT_KEY:-osiris-local-reports}
      - SCANNER_URL=${SCANNER_URL:-}
      - SCANNER_KEY=${SCANNER_KEY:-}
      - FIRMS_API_KEY=${FIRMS_API_KEY:-}
      - AIS_API_KEY=${AIS_API_KEY:-}
      - OPENSKY_CLIENT_ID=${OPENSKY_CLIENT_ID:-}
      - OPENSKY_CLIENT_SECRET=${OPENSKY_CLIENT_SECRET:-}
      - N2YO_API_KEY=${N2YO_API_KEY:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - SDK_INGEST_KEY=${SDK_INGEST_KEY:-}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY:-}
      - HELIUS_API_KEY=${HELIUS_API_KEY:-}
      - ASTRA_GPU_URL=${ASTRA_GPU_URL:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - GITHUB_WEBHOOK_FORWARD_URL=${GITHUB_WEBHOOK_FORWARD_URL:-}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      - GEMINI_API_KEY_1=${GEMINI_API_KEY_1:-}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2:-}
      - GEMINI_API_KEY_3=${GEMINI_API_KEY_3:-}
      - GEMINI_API_KEY_4=${GEMINI_API_KEY_4:-}
      - GEMINI_API_KEY_5=${GEMINI_API_KEY_5:-}
      - GEMINI_API_KEY_6=${GEMINI_API_KEY_6:-}
      - GEMINI_API_KEY_7=${GEMINI_API_KEY_7:-}
      - GEMINI_API_KEY_8=${GEMINI_API_KEY_8:-}
    depends_on:
      osiris-intel:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - default

  osiris-cache:
    image: nginx:alpine
    container_name: osiris-cache
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      osiris:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  osiris-intel:
    build:
      context: ./intel
      dockerfile: Dockerfile
    container_name: osiris-intel
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      PGHOST: osiris-postgres
      PGPORT: 5432
      PGDATABASE: osiris
      PGUSER: osiris
      PGPASSWORD: ${ONTOLOGY_DB_PASSWORD:-osiris-local-dev}
      OSIRIS_INTERNAL_URL: http://osiris:3000
      INTELLIGENCE_REPORT_KEY: ${INTELLIGENCE_REPORT_KEY:-osiris-local-reports}
      HISTORY_TELEMETRY_DAYS: ${HISTORY_TELEMETRY_DAYS:-14}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-90}
      INTELLIGENCE_WORKER: ${INTELLIGENCE_WORKER:-1}
    depends_on:
      osiris-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  osiris-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: osiris
      POSTGRES_USER: osiris
      POSTGRES_PASSWORD: ${ONTOLOGY_DB_PASSWORD:-osiris-local-dev}
    volumes:
      - ontology-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osiris -d osiris"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  nginx-cache:
  ontology-postgres:

# ── CasaOS app-store metadata (ignored by plain Docker Compose) ──
x-casaos:
  architectures:
    - amd64
    - arm64
  main: osiris
  author: simplifaisoul
  developer: simplifaisoul
  category: Network
  description:
    en_us: >-
      OSIRIS is a production-grade open-source OSINT situational-awareness
      dashboard. It aggregates real-time global intelligence across aviation,
      maritime, CCTV networks, seismic activity, wildfires, news feeds,
      weather, space weather, cyber threats (CVEs) and conflict zones into a
      single GPU-accelerated MapLibre interface. Most features work with no
      API keys.
  tagline:
    en_us: Real-time global OSINT intelligence dashboard
  title:
    en_us: OSIRIS
  icon: https://raw.githubusercontent.com/simplifaisoul/osiris/master/public/casaos-icon.png
  thumbnail: https://raw.githubusercontent.com/simplifaisoul/osiris/master/public/og-image.png
  screenshot_link:
    - https://raw.githubusercontent.com/simplifaisoul/osiris/master/public/og-image.png
  scheme: http
  hostname: ""
  port_map: "3000"
  index: /
  webui_port: 3000
  envs:
    - container: SCANNER_URL
      description:
        en_us: "(Optional) RECON scanner backend URL, e.g. http://scanner:7700"
    - container: SCANNER_KEY
      description:
        en_us: "(Optional) RECON scanner shared secret (must match backend OSIRIS_KEY)."
    - container: FIRMS_API_KEY
      description:
        en_us: "(Optional) NASA FIRMS API key for active-fire data."
    - container: AIS_API_KEY
      description:
        en_us: "(Optional) aisstream.io key for maritime vessel tracking."
    - container: OPENSKY_CLIENT_ID
      description:
        en_us: "(Optional) OpenSky OAuth2 client id for higher aircraft rate limits."
    - container: OPENSKY_CLIENT_SECRET
      description:
        en_us: "(Optional) OpenSky OAuth2 client secret."
    - container: N2YO_API_KEY
      description:
        en_us: "(Optional) N2YO key for satellite tracking."
  ports:
    - container: "3000"
      description:
        en_us: "Web UI (HTTP)."
